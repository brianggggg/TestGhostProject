name: Docs

on:
  push:
    branches:
      - main
      - master
      - claude/text-file-game-updates-sb6bo4
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Configure git identity for gh-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate repo summary page
        run: python scripts/generate_repo_summary.py

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean

      - name: Notify claude-plugin-skills-demo to rebuild
        # Cross-repo test — see that repo's docs/guides/faq.md and
        # scripts/generate_repo_summary.py (build_cross_repo_test). Keeps
        # its "items in TestGhostProject" numbers current whenever this
        # repo's own site deploys, not just when the other repo is pushed
        # to directly. Needs a CROSS_REPO_DISPATCH_TOKEN secret here — a
        # PAT (fine-grained: Contents read/write + Actions write on
        # brianggggg/claude-plugin-skills-demo) — since the default
        # GITHUB_TOKEN can't trigger workflows in another repo. Silently
        # skipped if that secret isn't set, so it never fails this repo's
        # own deploy.
        if: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN != '' }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/brianggggg/claude-plugin-skills-demo/dispatches \
            -d '{"event_type":"testghostproject-updated"}'
